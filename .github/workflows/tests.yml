name: Testes (CPU)
# Suíte rápida (sem modelos de IA, sem Blender, sem GPU). Roda a cada push/PR e também é chamada pelo
# workflow de Release (release.yml) antes de qualquer publicação: se falhar, nada é publicado.
on:
  push:
    branches: ["claude/**", "feature/**", "main"]
  pull_request:
    branches: ["claude/**", "main"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Dependências fixas + verificação
        run: |
          python -m pip install -r packaging/ci/requirements-tests.txt
          python -m pip check
      - name: Testes rápidos (toda a pasta tests/, inclusive módulos como tests/lead_finder)
        env:
          QT_QPA_PLATFORM: offscreen
        # Sem lista fixa: todo arquivo de teste novo entra sozinho. Os marcadores tiram render, pesos de modelos e
        # GPU; testes que precisam de PyTorch/diffusers/bpy se pulam sozinhos (não estão nas dependências do CI).
        run: python -m pytest -q -m "not slow and not models and not gpu" tests
