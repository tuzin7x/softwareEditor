name: Testes (CPU)
on:
  push:
    branches: ["claude/**", "feature/**", "main"]
  pull_request:
    branches: ["claude/**", "main"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install numpy scipy pillow shapely opencv-python-headless imageio-ffmpeg OpenEXR PySide6==6.12.0 pytest
      - name: Testes rápidos (sem modelos, sem Blender)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not slow and not models and not gpu" tests/test_compositor.py tests/test_choreography.py tests/test_room.py tests/test_encoder.py tests/test_sunlight.py tests/test_depth_mesh.py tests/test_scene_spec.py tests/test_bootstrap.py tests/test_ui.py tests/test_modules.py
