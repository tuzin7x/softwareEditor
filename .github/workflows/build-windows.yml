name: Build Windows (.exe + instalador)
on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar o instalador em Releases"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências da interface
        run: python -m pip install -r requirements/ui.txt
      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = (python -c "import mobilia; print(mobilia.__version__)").Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
      - name: PyInstaller (onedir)
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/7xai.spec
      - name: Autoteste do executável
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\7xAi\7xAi.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest falhou: $($p.ExitCode)" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: 7xAi-Setup
          path: dist/7xAi-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: 7xAi-onedir
          path: dist/7xAi
      # Publica em Releases quando o commit tem "[release]" na mensagem ou no disparo manual com "publicar".
      - name: Zip portátil
        if: contains(github.event.head_commit.message, '[release]') || inputs.publicar
        shell: pwsh
        run: Compress-Archive -Path dist\7xAi -DestinationPath "dist\7xAi-portatil-${{ steps.ver.outputs.versao }}.zip"
      - name: Publicar em Releases
        if: contains(github.event.head_commit.message, '[release]') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 7xAi ${{ steps.ver.outputs.versao }} (build ${{ github.run_number }})
          prerelease: true
          body: |
            **Como instalar:** baixe `7xAi-Setup-${{ steps.ver.outputs.versao }}.exe`, execute e siga o instalador.
            O atalho **7xAi** aparece na Área de Trabalho. No primeiro uso o programa baixa o motor de IA
            (alguns GB; precisa de placa NVIDIA). Alternativa sem instalar: o `.zip` portátil (abra `7xAi.exe`).

            O Windows pode avisar "editor desconhecido" (o programa não tem assinatura digital paga):
            clique em **Mais informações → Executar assim mesmo**.
          files: |
            dist/7xAi-Setup-*.exe
            dist/7xAi-portatil-*.zip
