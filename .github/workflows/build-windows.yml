name: Build Windows (.exe + instalador)
on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependências da interface
        run: python -m pip install -r requirements/ui.txt
      - name: PyInstaller (onedir)
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/mobilia_studio.spec
      - name: Autoteste do executável
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\MobiliaStudio\MobiliaStudio.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "selftest falhou: $($p.ExitCode)" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: MobiliaStudio-Setup
          path: dist/MobiliaStudio-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MobiliaStudio-onedir
          path: dist/MobiliaStudio
