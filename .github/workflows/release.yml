name: Release oficial (instalador + portátil)
# Publica UMA versão oficial do 7xAi no GitHub Releases. Só roda quando o dono clica em "Run workflow" na aba
# Actions, escolhendo a branch main e digitando a versão (ex.: 1.0.0). Passo a passo: docs/RELEASES.md.
#
# Garantias:
# - só na main; a versão digitada tem de ser igual a mobilia/__init__.py (fonte única) e o CHANGELOG.md tem de ter
#   a seção dessa versão, sem a marca RASCUNHO;
# - testes + verificação de dependências + build + autotestes dos executáveis: se QUALQUER etapa falhar, nada é
#   publicado (a publicação é o último job e depende de todos os outros);
# - tudo sai do MESMO commit (github.sha): os testes, o build e a tag vX.Y.Z apontam para ele;
# - não publica duas vezes: falha se a tag ou a Release já existirem; uma Release por vez (concurrency);
# - permissões mínimas: só o job "publicar" pode escrever no repositório; nenhum segredo além do GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar, igual à de mobilia/__init__.py (ex.: 1.0.0)"
        required: true
        type: string
permissions: {}
concurrency:
  group: release-oficial
  cancel-in-progress: false
env:
  VERSAO: ${{ inputs.versao }}
jobs:
  validar:
    name: 1. Validar versão, CHANGELOG e tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.ok.outputs.versao }}
    steps:
      - name: Só a partir da main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases oficiais só saem da main (pedido em $GITHUB_REF). Escolha 'main' em 'Use workflow from'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Versão = código, pyproject e CHANGELOG
        run: python scripts/release_notes.py check --version "$VERSAO"
      - name: A tag e a Release ainda não existem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSAO" --jq '.[].ref' | grep -qx "refs/tags/v$VERSAO"; then
            echo "::error::A tag v$VERSAO já existe. Cada versão é publicada uma única vez: aumente a versão (docs/RELEASES.md)."
            exit 1
          fi
          if gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Já existe uma Release v$VERSAO (talvez um rascunho de uma tentativa anterior). Apague-a ou aumente a versão."
            exit 1
          fi
      - id: ok
        run: echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

  testes:
    name: 2. Testes
    needs: validar
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    name: 3. Build Windows + autotestes + SHA-256
    needs: [validar, testes]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Dependências fixas + verificação
        run: |
          python -m pip install -r packaging/ci/requirements-build.txt
          python -m pip check
      - name: Mesma versão no código
        shell: pwsh
        run: |
          $v = (python packaging/win_version.py).Trim()
          if ($v -ne $env:VERSAO) { throw "Versão do código ($v) diferente da pedida ($env:VERSAO)" }
      - name: PyInstaller (pasta do programa, usada pelo instalador)
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/7xai.spec
      - name: PyInstaller (portátil, arquivo único)
        shell: pwsh
        run: |
          $env:SEVENXAI_ONEFILE = "1"
          python -m PyInstaller --noconfirm --distpath dist-portable --workpath build-portable packaging/7xai.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (portátil) falhou" }
      - name: Inno Setup (instalador)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSAO" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou" }
      - name: Montar os arquivos com os nomes oficiais
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\7xAi-Setup-$env:VERSAO.exe" "release\7xAI-Setup-v$env:VERSAO.exe"
          Copy-Item "dist-portable\7xAi.exe" "release\7xAI-Portable-v$env:VERSAO.exe"
          Get-ChildItem release | Format-Table Name, Length
      - name: Autotestes (abre cada executável sem tela e confere versão)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          function Test-Exe([string]$Exe, [string]$Nome) {
            if (-not (Test-Path $Exe)) { throw "$Nome não existe: $Exe" }
            $pv = (Get-Item $Exe).VersionInfo.ProductVersion
            if ($pv -ne $env:VERSAO) { throw "$Nome tem versão '$pv', esperado '$env:VERSAO'" }
            $p = Start-Process -FilePath $Exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$Nome falhou no autoteste (código $($p.ExitCode))" }
            Write-Host "OK: $Nome ($pv)"
          }
          Test-Exe "dist\7xAi\7xAi.exe" "programa (pasta)"
          Test-Exe "release\7xAI-Portable-v$env:VERSAO.exe" "portátil"
          # o instalador de verdade: instala em silêncio numa pasta temporária e abre o programa instalado
          $dir = Join-Path $env:RUNNER_TEMP "7xAI-instalado"
          $setup = (Resolve-Path "release\7xAI-Setup-v$env:VERSAO.exe").Path
          $instArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir")
          $i = Start-Process -FilePath $setup -ArgumentList $instArgs -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "O instalador falhou (código $($i.ExitCode))" }
          Test-Exe (Join-Path $dir "7xAi.exe") "programa instalado"
      - name: SHA-256 e dados do build
        shell: pwsh
        run: |
          python scripts/release_notes.py sums --assets release
          @{ versao = $env:VERSAO; commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -Encoding utf8 build-info.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            release/
            build-info.json
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: 4. Criar tag + Release e anexar arquivos
    needs: [validar, testes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write          # único job que escreve: cria a tag e a Release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: artefato
      - name: Integridade (SHA-256, nomes e commit do build)
        run: |
          set -euo pipefail
          cd artefato/release
          sha256sum -c SHA256SUMS.txt
          esperado="7xAI-Portable-v$VERSAO.exe 7xAI-Setup-v$VERSAO.exe SHA256SUMS.txt"
          achado="$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$achado" != "$esperado" ]; then echo "::error::Arquivos inesperados: $achado"; exit 1; fi
          python - <<'EOF'
          import json, os, sys
          info = json.load(open("../build-info.json", encoding="utf-8-sig"))
          if info["commit"] != os.environ["GITHUB_SHA"] or info["versao"] != os.environ["VERSAO"]:
              sys.exit(f"::error::Build de outro commit/versão: {info}")
          print("ok:", info)
          EOF
      - name: Conferir de novo que a tag e a Release não existem
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSAO" --jq '.[].ref' | grep -qx "refs/tags/v$VERSAO"; then
            echo "::error::A tag v$VERSAO apareceu durante a execução."; exit 1
          fi
          if gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Já existe uma Release (ou rascunho) v$VERSAO."; exit 1
          fi
      - name: Notas da versão
        run: |
          python scripts/release_notes.py notes --version "$VERSAO" --assets artefato/release \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --out notas.md
          cat notas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Criar a Release como rascunho e anexar os arquivos
        run: |
          gh release create "v$VERSAO" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "7xAi v$VERSAO" --notes-file notas.md \
            "artefato/release/7xAI-Setup-v$VERSAO.exe" "artefato/release/7xAI-Portable-v$VERSAO.exe" \
            "artefato/release/SHA256SUMS.txt"
          n=$(gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$n" != "3" ]; then echo "::error::Esperava 3 arquivos anexados, achei $n"; exit 1; fi
      - name: Publicar (cria a tag no commit testado)
        run: gh release edit "v$VERSAO" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: A tag aponta para o commit testado
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSAO" --jq '.object.sha')
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::A tag v$VERSAO aponta para $sha, mas o build foi de $GITHUB_SHA. Veja docs/RELEASES.md (Desfazer)."
            exit 1
          fi
          echo "Publicado: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSAO"
      - name: Limpar rascunho incompleto
        if: failure()
        run: |
          if [ "$(gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSAO" --repo "$GITHUB_REPOSITORY" --yes
            echo "Rascunho v$VERSAO apagado; nada foi publicado."
          fi
