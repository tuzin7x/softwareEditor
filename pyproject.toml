[project]
name = "mobilia-studio"
# A versão vem de mobilia/__init__.py (__version__): é a fonte única (ver docs/RELEASES.md).
dynamic = ["version"]
description = "7xAi: redesenho de ambientes por IA a partir de uma foto (local, GPU NVIDIA) e Lead Finder para o mercado imobiliário."
requires-python = ">=3.13"
readme = "README.md"

[project.scripts]
mobilia = "mobilia.cli:main"

[project.gui-scripts]
mobilia-studio = "mobilia.ui.app:main"

[tool.setuptools.dynamic]
version = {attr = "mobilia.__version__"}

[tool.setuptools.packages.find]
include = ["mobilia*"]

[tool.pytest.ini_options]
markers = [
  "slow: demorado (Blender/render ou modelos de IA em CPU)",
  "models: precisa dos pesos MoGe-2/OneFormer",
  "gpu: precisa de GPU NVIDIA",
]
