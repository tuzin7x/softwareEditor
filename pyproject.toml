[project]
name = "mobilia-studio"
version = "0.1.0"
description = "Decoração virtual cinematográfica em vídeo a partir de uma única foto, 100% local (GPU NVIDIA)."
requires-python = ">=3.13"
readme = "README.md"

[project.scripts]
mobilia = "mobilia.cli:main"

[project.gui-scripts]
mobilia-studio = "mobilia.ui.app:main"

[tool.setuptools.packages.find]
include = ["mobilia*"]

[tool.pytest.ini_options]
markers = [
  "slow: demorado (Blender/render ou modelos de IA em CPU)",
  "models: precisa dos pesos MoGe-2/OneFormer",
  "gpu: precisa de GPU NVIDIA",
]
